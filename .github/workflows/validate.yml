name: Validate TokenOps Portfolio Embed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install

      - name: Validate registries and build embed bundle
        run: npm run validate

      - name: Run calculation and embed-contract tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run user-interface smoke tests
        run: npm run test:ui

      - name: Upload validated portfolio embed bundle
        uses: actions/upload-artifact@v5
        with:
          name: tokenops-portfolio-embed
          path: dist/portfolio-embed
