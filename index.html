<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TokenOps Local Portfolio Embed Harness | Raghuramreddy</title>
  <style>
    :root,[data-theme="dark"]{
      --bg-primary:#0a0a0f;--bg-secondary:#111118;--bg-tertiary:#1a1a24;
      --text-primary:#f8fafc;--text-secondary:#94a3b8;--text-muted:#64748b;
      --accent-primary:#3b82f6;--accent-secondary:#8b5cf6;
      --accent-gradient:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);
      --border-color:#1e293b;--card-bg:rgba(17,17,24,.8);
      --glass-bg:rgba(17,17,24,.9);--glass-border:rgba(255,255,255,.1);
      --font-primary:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --container-max:1180px;--container-padding:24px;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-primary)}
    .harness-nav{position:sticky;top:0;z-index:10;background:var(--glass-bg);border-bottom:1px solid var(--glass-border);backdrop-filter:blur(20px)}
    .nav-inner{max-width:var(--container-max);margin:auto;padding:14px var(--container-padding);display:flex;justify-content:space-between;align-items:center}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--accent-gradient);font-size:13px;font-weight:700}
    .brand strong{display:block}.brand small{display:block;font-size:10px;background:var(--accent-gradient);background-clip:text;-webkit-background-clip:text;color:transparent}
    .local{font-size:12px;color:var(--text-secondary);border:1px solid var(--border-color);border-radius:999px;padding:7px 10px}
    footer{max-width:var(--container-max);margin:0 auto;padding:2rem var(--container-padding);border-top:1px solid var(--border-color);color:var(--text-secondary);font-size:.85rem}
  </style>
  <link rel="stylesheet" href="./dist/portfolio-embed/tokenops-lab.css">
</head>
<body>
  <nav class="harness-nav" aria-label="Local preview portfolio shell">
    <div class="nav-inner">
      <div class="brand"><span class="logo">RRR</span><span><strong>Raghuramreddy</strong><small>Designing technology for human experience</small></span></div>
      <span class="local">Local module preview only</span>
    </div>
  </nav>
  <main><div id="tokenops-lab-root"></div></main>
  <footer><strong>Local development harness.</strong> The public TokenOps experience is intended to render inside the portfolio website, not from this repository directly.</footer>
  <script type="module" src="./dist/portfolio-embed/tokenops-lab.js"></script>
</body>
</html>
